<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<div id="app">
  <h1>{{message}}</h1>
  <p>Name {{name}}</p>
  <p>Age: {{age}}</p>
</div>

<script type="module">
  const { createApp } = Vue;

  createApp({
    setup() {
      const message = "Xin chào thế giới!";
      const name = "NgocBQ";
      const age = 20;
      return {
        message,
        name,
        age,
      };
    },
  }).mount("#app");
</script>
